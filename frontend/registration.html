<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VJS pyro Park - Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0b0b;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 420px;
            padding: 30px;
            background: #151515;
            border: 1px solid #333;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
            color: #c6a15b;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            background: #222;
            color: white;
            border: 1px solid #444;
            border-radius: 8px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #c6a15b;
            color: #111;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            color: #c6a15b;
            min-height: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>VJ Spyro Park</h1>

    <p class="subtitle">Admin Login</p>

    <form id="adminLoginForm">

        <label>Email</label>

        <input
            type="email"
            id="email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            required
        >

        <button type="submit">
            LOGIN
        </button>

    </form>

    <div id="message"></div>

</div>

<script>

const form = document.getElementById("adminLoginForm");
const message = document.getElementById("message");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    message.textContent = "Checking login...";

    try {

        const response = await fetch(
            "https://vjs-pyro-park-backend.onrender.com/api/auth/login",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            }
        );

        const data = await response.json();

        console.log("LOGIN RESPONSE:", data);

        if (!response.ok) {

            message.textContent =
                data.message || "Login failed";

            return;
        }

        localStorage.setItem(
            "adminToken",
            data.token
        );

        localStorage.setItem(
            "adminUser",
            JSON.stringify(data.user)
        );

        message.textContent = "Login successful!";

        window.location.href = "admin.html";

    } catch (error) {

        console.error("LOGIN ERROR:", error);

        message.textContent =
            "Cannot connect to backend";

    }

});

</script>

</body>
</html>
